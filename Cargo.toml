[package]
name = "ragasukma-tui"
version = "0.1.0"
edition = "2024"
authors = ["Ahlan Saputra <hlnsptr@gmail.com>"]
description = "Terminal User Interface (TUI) for Ragasukma autonomous agent & LLM manager"
license = "MIT"
readme = "README.md"

[dependencies]
ragasukma-core = { path = "../ragasukma-core" }
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
futures-util = "0.3"
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3.10"
