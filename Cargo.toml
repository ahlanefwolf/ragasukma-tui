[package]
name = "ragasukma-tui"
version = "0.3.1"
edition = "2024"
authors = ["Ahlan Saputra <hlnsptr@gmail.com>"]
description = "Terminal User Interface (TUI) for Ragasukma autonomous agent & LLM manager"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ahlanefwolf/ragasukma-tui"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
ragasukma-core = { git = "https://github.com/ahlanefwolf/ragasukma-core.git" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
open = "5.3"
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
color-eyre = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ignore = "0.4"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[patch."https://github.com/ahlanefwolf/ragasukma-core.git"]
ragasukma-core = { path = "../ragasukma-core" }
