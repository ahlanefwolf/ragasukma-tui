name: "Release TUI (Native Multiplatform CI/CD)"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: "ubuntu-24.04"
            target: "x86_64-unknown-linux-gnu"
            archive_name: "ragasukma-tui-linux-x86_64.tar.gz"
            binary_name: "ragasukma-tui"

          # Windows x86_64
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            archive_name: "ragasukma-tui-windows-x86_64.zip"
            binary_name: "ragasukma-tui.exe"

          # macOS Apple Silicon (M1/M2/M3/M4)
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            archive_name: "ragasukma-tui-macos-arm64.tar.gz"
            binary_name: "ragasukma-tui"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Strip local [patch] to force building against remote git dependency in CI
      - name: Strip local Cargo patches for CI build
        shell: bash
        run: |
          echo "=== Removing local [patch] from Cargo.toml ==="
          node -e '
            const fs = require("fs");
            let c = fs.readFileSync("Cargo.toml", "utf8");
            c = c.replace(/\[patch\.[^\]]+\][\s\S]*?(?=\n\[|$)/g, "");
            fs.writeFileSync("Cargo.toml", c.trimEnd() + "\n");
          '
          echo "=== Cargo.toml content ==="
          cat Cargo.toml

      # Linux dependencies
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build TUI Release Binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      # Prepare Release Directory
      - name: Package Binary (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cd "target/${{ matrix.target }}/release"
          tar -czvf "../../../release/${{ matrix.archive_name }}" "${{ matrix.binary_name }}"
          cd ../../../
          cd release
          shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          $bin = "target\${{ matrix.target }}\release\${{ matrix.binary_name }}"
          Compress-Archive -Path $bin -DestinationPath "release\${{ matrix.archive_name }}"
          $hash = (Get-FileHash "release\${{ matrix.archive_name }}" -Algorithm SHA256).Hash
          "$hash  ${{ matrix.archive_name }}" | Out-File -FilePath "release\${{ matrix.archive_name }}.sha256" -Encoding utf8

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
